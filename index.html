<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Camila</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f7f4ef;
        font-family: Georgia, "Times New Roman", serif;
        color: #292929;
    }

    .player {
        width: min(420px, 92vw);
        padding: 32px 28px;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,.10);
    }

    .cover {
        width: 220px;
        height: 220px;
        margin: 0 auto 25px;
        border-radius: 14px;
        overflow: hidden;
        background: #e9e3d9;
        box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .eyebrow {
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8b7b67;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 27px;
        font-weight: normal;
    }

    .subtitle {
        margin: 8px 0 25px;
        color: #777;
        font-size: 15px;
        font-style: italic;
    }

    audio {
        width: 100%;
    }

    .dedication {
        margin-top: 25px;
        font-size: 14px;
        line-height: 1.6;
        color: #777;
    }
</style>
</head>

<body>

<div class="player">

    <div class="cover">
        <img src="PORTADA.jpg" alt="Para Camila">
    </div>

    <div class="eyebrow">
        Una canción para ti
    </div>

    <h1>Todas las veces que te elegiría</h1>

    <div class="subtitle">
        Para Camila
    </div>

    <audio controls preload="metadata">
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
    </audio>

    <div class="dedication">
        15 años, miles de recuerdos<br>
        y todavía muchas primeras veces por vivir.
    </div>

</div>

</body>
</html>
